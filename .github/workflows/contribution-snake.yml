name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate animated contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish animation to output branch
        env:
          TARGET_BRANCH: output
        run: |
          mkdir -p /tmp/contribution-snake
          cp dist/*.svg /tmp/contribution-snake/
          git switch --orphan "$TARGET_BRANCH"
          git rm -rf . || true
          cp /tmp/contribution-snake/*.svg .
          git add *.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contribution snake"
          git push --force origin "$TARGET_BRANCH"
