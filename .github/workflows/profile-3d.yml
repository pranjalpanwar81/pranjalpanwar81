name: 3D contribution skyline

on:
  schedule:
    - cron: "0 18 * * *"   # daily, ~11:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove star and fork counters
        run: |
          ./scripts/strip-3d-stars-forks.sh
          cp profile-3d-contrib/profile-night-rainbow.svg assets/skyline.svg
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: refresh 3D contributions" || exit 0
          git push
