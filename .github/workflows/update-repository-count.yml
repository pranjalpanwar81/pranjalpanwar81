name: Update public repository count

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update visible repository count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/repos?per_page=100" | jq -s 'add | length')"
          perl -0pi -e "s/(<!-- REPO_COUNT_START -->)\d+(<!-- REPO_COUNT_END -->)/\$1${count}\$2/" README.md
          if git diff --quiet README.md; then
            echo "Repository count is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update public repository count"
          git push
